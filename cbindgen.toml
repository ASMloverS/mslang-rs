language = "C"
include_guard = "MSLANG_GENERATED_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify manually. */"
tab_width = 4
style = "tag"
include_version = true

[defines]
"feature = capi" = "MS_CAPI_ENABLED"

[export]
include = [
    "MsStatus",
    "MsType",
    "MsGcType",
    "MsFutureState",
]

[fn]
prefix = "MS_API"

[struct]
rename_fields = "SnakeCase"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
include = ["mslang"]

# NOTE: [parse.expand] was intentionally omitted. cbindgen's macro expansion
# invokes `rustc -Zunpretty=expanded`, which is nightly-only; this project
# builds on stable. Expansion is not required to generate bindings for the
# placeholder modules or for the typical `#[repr(C)] struct` / `#[no_mangle]
# pub extern "C" fn` definitions used by later C API tasks (67-74), which
# cbindgen parses directly from the source AST. If a future task needs to
# expand a proc-macro that synthesizes such items, re-enable expansion on a
# nightly toolchain.

[package]
name = "mslang"
version = "0.1.0"
edition = "2021"
description = "mslang scripting language implementation"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
parking_lot = "0.12"
libloading = { version = "0.8", optional = true }
rand = "0.8"
rustyline = "14"
# task 85（16-stdlib-expansion.md §2.5）：regex/hash 模块（M7）。
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[[bin]]
name = "ms"
path = "src/main.rs"

[features]
capi = ["dep:libloading"]

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cbindgen = "0.26"
cc = "1.0"
